apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "huckleberry-bff.fullname" . }}-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "huckleberry-bff.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "huckleberry-bff.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "huckleberry-bff.fullname" . }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["node", "dist/src/scripts/migrate-prod.js"]
          envFrom:
            - secretRef:
                name: {{ include "huckleberry-bff.fullname" . }}-secrets
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: DATABASE_RUN_MIGRATIONS
              value: "true"
