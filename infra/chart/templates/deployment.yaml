apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "huckleberry-bff.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "huckleberry-bff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "huckleberry-bff.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "huckleberry-bff.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "huckleberry-bff.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: bff
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "huckleberry-bff.fullname" . }}-secrets
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
