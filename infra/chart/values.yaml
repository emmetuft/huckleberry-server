# Default values for huckleberry-bff. Per-environment files (values-dev3.yaml,
# etc.) override these. This file exists so `helm install` works without -f.
image:
  repository: huckleberry-bff
  tag: latest

replicaCount: 1

ingress:
  host: localhost
  certificateArn: ""

env:
  NODE_ENV: production
  PORT: "3000"
  DATABASE_RUN_MIGRATIONS: "false"

externalSecret:
  secretStoreRef: aws-secrets-manager
  remoteRef:
    key: huckleberry-bff

resources:
  requests:
    cpu: 256m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

hpa:
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

serviceAccount:
  iamRoleArn: ""
