# Values for the dev3 environment. Override defaults in values.yaml.
image:
  repository: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/huckleberry-bff
  tag: latest  # overridden by CI with the git SHA

replicaCount: 2

ingress:
  host: api-dev3.huckleberry.ai

env:
  NODE_ENV: production
  PORT: "3000"
  DATABASE_RUN_MIGRATIONS: "false"  # migrations run in the pre-upgrade Job

  # Non-secret config — safe to put here
  GATEKEEPER_ISSUERS: "https://dev3.domo.com"
  DEV_INSTANCE_ISSUER_URL: ""
  DEV_INSTANCE_CUSTOMER_ID: ""

# Secret values come from ExternalSecret (Secrets Manager → k8s Secret)
# The pod mounts the resulting k8s Secret as env vars.
externalSecret:
  secretStoreRef: aws-secrets-manager  # ClusterSecretStore name
  remoteRef:
    key: dev3-huckleberry-1  # Secrets Manager secret name

resources:
  requests:
    cpu: 256m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

hpa:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

serviceAccount:
  iamRoleArn: arn:aws:iam::<ACCOUNT_ID>:role/huckleberry-bff-pod-role-dev3
