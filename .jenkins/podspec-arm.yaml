apiVersion: v1
kind: Pod
metadata: {}
spec:
  nodeSelector:
    kubernetes.io/arch: arm64
  tolerations:
  - key: jenkins-arm
    operator: Exists
  volumes:
  - name: fuse
    hostPath:
      path: /dev/fuse
  containers:
  - name: buildah-arm
    image: 972900829293.dkr.ecr.us-east-1.amazonaws.com/build/buildah:v1.42.2-slim
    command:
    - sleep
    args:
    - 99d
    tty: true
    securityContext:
      privileged: true
    volumeMounts:
    - name: fuse
      mountPath: /dev/fuse
    resources:
      requests:
        cpu: 1500m
        memory: 4Gi
      limits:
        memory: 8Gi
